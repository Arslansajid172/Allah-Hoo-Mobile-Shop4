  // ================= REPORTS =================
  function renderReports(){
    var now=new Date(), from, to=null;
    if(state.reportRange==='today') from=startOfDay(now);
    else if(state.reportRange==='week') from=startOfWeek(now);
    else if(state.reportRange==='month') from=startOfMonth(now);
    else { from = state.reportFrom ? new Date(state.reportFrom) : startOfDay(now); to = state.reportTo ? new Date(new Date(state.reportTo).getTime()+86399999) : new Date(); }
    var filtered = salesInRange(from, to).sort(function(a,b){ return b.ts-a.ts; });
    var revenue = filtered.reduce(function(s,x){ return s+x.total; },0);
    var cost = filtered.reduce(function(s,x){ return s + x.items.reduce(function(ss,l){ return ss + l.qty*(l.cost||0); },0); },0);
    var profit = revenue - cost;
    var itemTotals = {};
    filtered.forEach(function(s){ s.items.forEach(function(l){ itemTotals[l.name]=(itemTotals[l.name]||0)+l.qty; }); });
    var topItems = Object.keys(itemTotals).map(function(k){ return {name:k,qty:itemTotals[k]}; }).sort(function(a,b){ return b.qty-a.qty; }).slice(0,5);

    var saleCount = filtered.filter(function(s){ return s.type!=='return'; }).length;
    var returnCount = filtered.filter(function(s){ return s.type==='return'; }).length;
    var unitsSold = filtered.reduce(function(s,x){ return s + x.items.reduce(function(ss,l){ return ss + l.qty; },0); },0);
    var avgSale = saleCount ? (revenue/saleCount) : 0;
    var creditIssued = filtered.filter(function(s){ return s.paymentType==='credit' && s.type!=='return'; }).reduce(function(s,x){ return s+x.total; },0);
    var summaryLine = saleCount ? (
      saleCount+' sale(s) and '+returnCount+' return(s), '+unitsSold+' unit(s) net movement. Average sale value '+money(avgSale)+
      (creditIssued>0 ? ('. '+money(creditIssued)+' of this was sold on udhaar (credit).') : '.')+
      ' Net result: '+(profit<0?'a loss of ':'a profit of ')+money(Math.abs(profit))+'.'
    ) : 'No transactions in this period yet.';

    return ''+
    '<h2 class="pagetitle">'+t('reports')+'<button class="btn btn-outline btn-sm" id="pdfReportBtn">Download PDF</button></h2>'+
    '<div class="filterchips">'+repChip('today',t('today'))+repChip('week',t('thisWeek'))+repChip('month',t('thisMonth'))+repChip('custom',t('custom'))+'</div>'+
    (state.reportRange==='custom' ? ('<div class="row" style="margin-bottom:12px"><input type="date" id="repFrom" value="'+(state.reportFrom||'')+'"><input type="date" id="repTo" value="'+(state.reportTo||'')+'"><button class="btn btn-navy" id="repApply">Apply</button></div>') : '')+
    '<div class="grid3">'+
      '<div class="card stat"><b>'+money(revenue)+'</b><span>'+t('totalSale')+'</span></div>'+
      '<div class="card stat"><b>'+money(cost)+'</b><span>'+t('cost')+'</span></div>'+
      '<div class="card stat"><b class="'+plClass(profit)+'">'+money(Math.abs(profit))+'</b><span>'+(profit<0?t('loss'):t('profit'))+'</span></div>'+
    '</div>'+
    '<div class="card"><b style="font-size:13px;color:var(--navy)">Summary</b><p style="font-size:13px;margin:8px 0 0;line-height:1.5">'+esc(summaryLine)+'</p></div>'+
    '<div class="card"><b style="font-size:13px;color:var(--navy)">Best-selling items</b>'+
      (topItems.length ? ('<table style="margin-top:8px">'+topItems.map(function(t2){ return '<tr><td>'+esc(t2.name)+'</td><td style="text-align:right">'+t2.qty+' pcs</td></tr>'; }).join('')+'</table>') : '<div class="empty">No sales in this period</div>')+
    '</div>'+
    '<div class="card"><b style="font-size:13px;color:var(--navy)">Transactions</b>'+
      (filtered.length ? ('<table style="margin-top:8px"><tr><th>Time</th><th>Items</th><th>Type</th><th style="text-align:right">Total</th><th></th></tr>'+
        filtered.map(function(s){
          var isReturn = s.type==='return';
          var daysSince = (Date.now()-s.ts)/86400000;
          var canReturn = !isReturn && daysSince<=7;
          return '<tr><td class="muted">'+fmtTime(s.ts)+(s.edited?' <span class="muted" style="font-size:10px">(edited)</span>':'')+'<br><span class="muted" style="font-size:10.5px">'+esc(s.staffName||'')+'</span></td>'+
            '<td>'+s.items.map(function(l){ return esc(l.name)+' &times;'+Math.abs(l.qty); }).join(', ')+'</td>'+
            '<td>'+(isReturn?'<span class="pill return">Return</span>':('<span class="pill '+(s.paymentType==='credit'?'credit':'cash')+'">'+(s.paymentType==='credit'?'Udhaar':'Cash')+'</span>'))+'</td>'+
            '<td style="text-align:right">'+money(s.total)+'</td>'+
            '<td>'+(canReturn?'<button class="btn btn-outline btn-sm" data-return="'+s.id+'">Return</button>':(!isReturn && daysSince>7?'<span class="muted" style="font-size:10.5px">Return window closed</span>':''))+
              (canEdit() && !isReturn ? ' <button class="btn btn-outline btn-sm" data-editsale="'+s.id+'">Edit</button>' : '')+
              (canEdit() && isReturn ? ' <button class="btn btn-danger btn-sm" data-undoreturn="'+s.id+'">Undo</button>' : '')+'</td></tr>';
        }).join('')+'</table>') : '<div class="empty">No transactions in this period</div>')+
    '</div>';
  }
  function repChip(val,label){ return '<button class="chip '+(state.reportRange===val?'active':'')+'" data-rep="'+val+'">'+esc(label)+'</button>'; }

  // How much of each line in a sale has already been returned (across all return records referencing it)
  function alreadyReturnedForSale(saleId){
    var totals = {};
    state.sales.forEach(function(s){
      if(s.type==='return' && s.refSaleId===saleId){
        s.items.forEach(function(l){ totals[l.itemId] = (totals[l.itemId]||0) + Math.abs(l.qty); });
      }
    });
    return totals;
  }

  function returnModal(saleId){
    var sale = state.sales.find(function(s){ return s.id===saleId; }); if(!sale) return;
    var already = alreadyReturnedForSale(sale.id);
    var lines = sale.items.map(function(l, idx){
      var remaining = l.qty - (already[l.itemId]||0);
      return {l:l, idx:idx, remaining:remaining};
    });
    if(lines.every(function(x){ return x.remaining<=0; })){ toast('Everything on this sale has already been returned'); return; }
    var html = '<div class="modal-bg" id="modalBg"><div class="modal"><button class="modal-close" id="modalClose">&times;</button>'+
      '<h3>Return items — sale '+fmtTime(sale.ts)+'</h3>'+
      lines.map(function(x){
        if(x.remaining<=0) return '<div class="row" style="align-items:center;margin-bottom:8px"><span style="flex:1;font-size:13px" class="muted">'+esc(x.l.name)+' — already fully returned</span></div>';
        return '<div class="row" style="align-items:center;margin-bottom:8px"><span style="flex:1;font-size:13px">'+esc(x.l.name)+' (sold '+x.l.qty+(x.remaining<x.l.qty?', '+x.remaining+' returnable':'')+')</span>'+
          '<input type="number" min="0" max="'+x.remaining+'" value="0" class="retQty" data-idx="'+x.idx+'" data-max="'+x.remaining+'" style="width:70px"></div>';
      }).join('')+
      '<button class="btn btn-danger btn-block" id="ret_confirm" style="margin-top:12px">Process return</button></div></div>';
    var wrap=document.createElement('div'); wrap.innerHTML=html; document.body.appendChild(wrap.firstChild);
    document.getElementById('modalClose').onclick = closeModal;
    document.getElementById('modalBg').addEventListener('click', function(e){ if(e.target.id==='modalBg') closeModal(); });
    document.getElementById('ret_confirm').onclick = function(){
      var qtyByIdx = {};
      Array.prototype.forEach.call(document.querySelectorAll('.retQty'), function(inp){
        var max = Number(inp.dataset.max)||0;
        var v = Math.max(0, Math.min(max, Number(inp.value)||0));
        qtyByIdx[Number(inp.dataset.idx)] = v;
      });
      if(!Object.keys(qtyByIdx).some(function(k){ return qtyByIdx[k]>0; })){ toast('Enter a return quantity'); return; }
      requireReauth('Process return for sale '+fmtTime(sale.ts), function(){
        closeModal();
        var retLines=[], retTotal=0;
        sale.items.forEach(function(l, idx){ var q=qtyByIdx[idx]||0; if(q>0){ retLines.push({itemId:l.itemId,name:l.name,qty:-q,rate:l.rate,cost:l.cost||0}); retTotal += -q*l.rate; } });
        var ret = {id:uid(), ts:Date.now(), type:'return', refSaleId:sale.id, staffId:state.currentStaff.id, staffName:state.currentStaff.name,
          paymentType:sale.paymentType, customerId:sale.customerId||null, items:retLines, subtotal:retTotal, discount:0, total:retTotal};
        var puts=[putOne('sales', ret)];
        retLines.forEach(function(l){ var it=state.items.find(function(x){return x.id===l.itemId;}); if(it){ it.stock=it.stock+Math.abs(l.qty); puts.push(putOne('items', it)); puts.push(logStock('return', it.id, it.name, Math.abs(l.qty), 'Returned from sale #'+sale.id.slice(-5))); } });
        if(sale.paymentType==='credit' && sale.customerId){
          var cust = state.customers.find(function(c){ return c.id===sale.customerId; });
          if(cust){ cust.balance=(cust.balance||0)+retTotal; cust.history=cust.history||[]; cust.history.push({ts:ret.ts,type:'credit',amount:retTotal,note:'Return adjustment'}); puts.push(putOne('customers', cust)); }
        }
        Promise.all(puts).then(function(){
          markDirtyAndSync();
          loadData().then(function(){
            render();
            var modal = document.createElement('div'); modal.className='modal-bg';
            modal.innerHTML = '<div class="modal"><h3>&#10003; Return processed</h3>'+
              '<p style="font-size:13.5px">'+money(Math.abs(retTotal))+' refunded'+(sale.paymentType==='credit'?' from udhaar balance':'')+'. Stock has been added back automatically.</p>'+
              '<button class="btn btn-navy btn-block" id="ret_ok">OK</button></div>';
            document.body.appendChild(modal);
            document.getElementById('ret_ok').onclick = function(){ modal.remove(); };
          });
        });
      });
    };
  }

  function undoReturnModal(returnId){
    var ret = state.sales.find(function(s){ return s.id===returnId; }); if(!ret) return;
    requireReauth('Undo this return (reverses stock and totals)', function(){
      var puts = [deleteOne('sales', ret.id)];
      ret.items.forEach(function(l){
        var it = state.items.find(function(x){ return x.id===l.itemId; });
        if(it){ it.stock = Math.max(0, it.stock - Math.abs(l.qty)); puts.push(putOne('items', it)); puts.push(logStock('undo-return', it.id, it.name, -Math.abs(l.qty), 'Undid return')); }
      });
      if(ret.paymentType==='credit' && ret.customerId){
        var cust = state.customers.find(function(c){ return c.id===ret.customerId; });
        if(cust){ cust.balance = (cust.balance||0) - ret.total; puts.push(putOne('customers', cust)); }
      }
      Promise.all(puts).then(function(){ markDirtyAndSync(); loadData().then(function(){ render(); toast('Return undone'); }); });
    });
  }

  function editSaleModal(saleId){
    var sale = state.sales.find(function(s){ return s.id===saleId; }); if(!sale) return;
    var html = '<div class="modal-bg" id="modalBg"><div class="modal"><button class="modal-close" id="modalClose">&times;</button>'+
      '<h3>Edit sale — '+fmtTime(sale.ts)+'</h3><p class="muted" style="font-size:12px;margin-top:-6px">Correct quantities or discount if this entry was made wrongly. Stock is adjusted automatically.</p>'+
      sale.items.map(function(l,idx){ return '<div class="row" style="align-items:center;margin-bottom:8px"><span style="flex:1;font-size:13px">'+esc(l.name)+' @ '+money(l.rate)+'</span>'+
        '<input type="number" min="0" value="'+l.qty+'" class="editQty" data-idx="'+idx+'" style="width:70px"></div>'; }).join('')+
      '<label>Discount (Rs)</label><input type="number" min="0" id="edit_discount" value="'+(sale.discount||0)+'">'+
      '<button class="btn btn-navy btn-block" id="edit_confirm" style="margin-top:12px">Save corrected entry</button></div></div>';
    var wrap=document.createElement('div'); wrap.innerHTML=html; document.body.appendChild(wrap.firstChild);
    document.getElementById('modalClose').onclick = closeModal;
    document.getElementById('modalBg').addEventListener('click', function(e){ if(e.target.id==='modalBg') closeModal(); });
    document.getElementById('edit_confirm').onclick = function(){
      var newQtys = Array.prototype.map.call(document.querySelectorAll('.editQty'), function(inp){ return Math.max(0, Number(inp.value)||0); });
      var newDiscount = Math.max(0, Number(document.getElementById('edit_discount').value)||0);
      requireReauth('Edit sale from '+fmtTime(sale.ts), function(){
        closeModal();
        var puts = [];
        var newSubtotal = 0;
        sale.items.forEach(function(l, idx){
          var oldQty = l.qty, newQty = newQtys[idx];
          var delta = oldQty - newQty; // positive delta => stock increases (less sold)
          var it = state.items.find(function(x){ return x.id===l.itemId; });
          if(it && delta!==0){ it.stock = Math.max(0, it.stock + delta); puts.push(putOne('items', it)); puts.push(logStock('edit-sale', it.id, it.name, delta, 'Sale edited #'+sale.id.slice(-5))); }
          l.qty = newQty;
          newSubtotal += newQty * l.rate;
        });
        var oldTotal = sale.total;
        sale.subtotal = newSubtotal; sale.discount = newDiscount; sale.total = Math.max(0, newSubtotal - newDiscount);
        sale.edited = true; sale.editedAt = Date.now();
        puts.push(putOne('sales', sale));
        if(sale.paymentType==='credit' && sale.customerId){
          var cust = state.customers.find(function(c){ return c.id===sale.customerId; });
          if(cust){ cust.balance = (cust.balance||0) + (sale.total - oldTotal); puts.push(putOne('customers', cust)); }
        }
        Promise.all(puts).then(function(){ markDirtyAndSync(); loadData().then(function(){ render(); toast('Entry corrected'); }); });
      });
    };
  }

  function wireReports(){
    Array.prototype.forEach.call(document.querySelectorAll('[data-rep]'), function(btn){ btn.onclick=function(){ state.reportRange=btn.dataset.rep; render(); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-return]'), function(btn){ btn.onclick=function(){ returnModal(btn.dataset.return); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-editsale]'), function(btn){ btn.onclick=function(){ editSaleModal(btn.dataset.editsale); }; });
    Array.prototype.forEach.call(document.querySelectorAll('[data-undoreturn]'), function(btn){ btn.onclick=function(){ undoReturnModal(btn.dataset.undoreturn); }; });
    var applyBtn = document.getElementById('repApply');
    if(applyBtn) applyBtn.onclick = function(){ state.reportFrom=document.getElementById('repFrom').value; state.reportTo=document.getElementById('repTo').value; render(); };
    var pdfBtn = document.getElementById('pdfReportBtn');
    if(pdfBtn) pdfBtn.onclick = function(){
      var now=new Date(), from,to=null,label;
      if(state.reportRange==='today'){ from=startOfDay(now); label='Today'; }
      else if(state.reportRange==='week'){ from=startOfWeek(now); label='This week'; }
      else if(state.reportRange==='month'){ from=startOfMonth(now); label='This month'; }
      else { from=state.reportFrom?new Date(state.reportFrom):startOfDay(now); to=state.reportTo?new Date(new Date(state.reportTo).getTime()+86399999):new Date(); label=(state.reportFrom||'?')+' to '+(state.reportTo||'?'); }
      var filtered = salesInRange(from,to);
      var rows = filtered.map(function(s){ return [fmtTime(s.ts), s.staffName||'', s.type==='return'?'Return':(s.paymentType==='credit'?'Udhaar':'Cash'), s.items.map(function(l){return l.name+' x'+Math.abs(l.qty);}).join(', '), money(s.total)]; });
      var revenue = totalOf(filtered);
      var profit = profitOf(filtered);
      var cost = revenue - profit;
      var udhaarGiven = filtered.filter(function(s){ return s.paymentType==='credit' && s.type!=='return'; }).reduce(function(s,x){ return s+x.total; },0);
      var t0 = from.getTime(), t1 = to?to.getTime():Infinity;
      var udhaarReceived = 0;
      state.customers.forEach(function(c){ (c.history||[]).forEach(function(h){ if(h.type==='payment' && h.ts>=t0 && h.ts<=t1) udhaarReceived += Math.abs(h.amount); }); });
      var summary = [
        'Total sale: '+money(revenue),
        'Total cost: '+money(cost),
        (profit<0?'Loss: ':'Profit: ')+money(Math.abs(profit)),
        'Udhaar (credit) given in this period: '+money(udhaarGiven),
        'Udhaar (payments) received in this period: '+money(udhaarReceived),
        'Net result: '+(profit<0?'Loss of ':'Profit of ')+money(Math.abs(profit))
      ];
      buildSimplePDF('Sales Report — '+label, ['Date','Staff','Type','Items','Total'], rows, 'sales-report.pdf', summary);
    };
  }

  // ================= PDF helper =================
  function buildSimplePDF(title, columns, rows, filename, summaryLines){
    if(!LIB.pdf || typeof window.jspdf==='undefined'){ toast('PDF library not loaded yet — check for an ad-blocker blocking scripts, or try again in a moment'); loadPdfLib(); return; }
    var doc = new window.jspdf.jsPDF();
    doc.setFontSize(14); doc.text(title,14,16);
    doc.setFontSize(9); doc.text('Allah Hoo Mobile Shop — Thingi Colony',14,22);
    var y=32, startX=14, totalW=182, colW=totalW/columns.length, colX=[];
    columns.forEach(function(c,i){ colX.push(startX+i*colW); });
    doc.setFontSize(9); doc.setFont(undefined,'bold');
    columns.forEach(function(c,i){ doc.text(String(c), colX[i], y); });
    doc.setFont(undefined,'normal'); y+=5; doc.line(14,y-3,196,y-3); y+=3;
    rows.forEach(function(row){
      if(y>270){ doc.addPage(); y=20; }
      row.forEach(function(cell,i){
        var text = String(cell==null?'':cell);
        if(text.length>28) text = text.slice(0,26)+'…';
        doc.text(text, colX[i], y);
      });
      y+=7;
    });
    if(!rows.length){ doc.text('No records in this range.', 14, y); y+=10; }
    if(summaryLines && summaryLines.length){
      if(y>250){ doc.addPage(); y=20; }
      y+=4; doc.line(14,y,196,y); y+=8;
      doc.setFont(undefined,'bold'); doc.setFontSize(11); doc.text('Summary', 14, y); y+=8;
      doc.setFont(undefined,'normal'); doc.setFontSize(10);
      summaryLines.forEach(function(line){
        if(y>280){ doc.addPage(); y=20; }
        doc.text(String(line), 14, y); y+=7;
      });
    }
    doc.save(filename);
  }

    '</div>'+
    '<div class="card"><b style="font-size:13px;color:var(--navy)">About this data</b>'+
      '<p class="muted" style="font-size:12px;margin:6px 0 0">All data is stored on this device and works fully offline. Connect Google Drive above to keep a backup and use the same data on another phone/PC.</p></div>';
  }
  function staffFormModal(existingId){
    var s = existingId ? state.config.staff.find(function(x){ return x.id===existingId; }) : {id:null,name:'',pin:'',role:'entry',lang:'en'};
    var isEdit = !!existingId;
    var html = '<div class="modal-bg" id="modalBg"><div class="modal"><button class="modal-close" id="modalClose">&times;</button>'+
      '<h3>'+(isEdit?'Edit staff':'Add staff login')+'</h3>'+
      '<label>Name</label><input type="text" id="st_name" value="'+esc(s.name)+'">'+
      '<label>Login PIN</label><input type="text" inputmode="numeric" maxlength="6" id="st_pin" value="'+esc(s.pin)+'">'+
      '<label>Role</label><select id="st_role"><option value="entry" '+(s.role==='entry'?'selected':'')+'>Entry only (sales/entries)</option><option value="editor" '+(s.role==='editor'?'selected':'')+'>Editor (can edit/delete)</option><option value="admin" '+(s.role==='admin'?'selected':'')+'>Admin (full access)</option></select>'+
      '<label>Language</label><select id="st_lang"><option value="en" '+(s.lang==='en'?'selected':'')+'>English</option><option value="ur" '+(s.lang==='ur'?'selected':'')+'>Urdu</option></select>'+
      '<div class="row" style="margin-top:16px">'+(isEdit?'<button class="btn btn-danger" id="st_delete" type="button">Remove</button>':'')+
        '<button class="btn btn-navy btn-block" id="st_save" type="button">'+t('save')+'</button></div>'+
    '</div></div>';
    var wrap=document.createElement('div'); wrap.innerHTML=html; document.body.appendChild(wrap.firstChild);
    document.getElementById('modalClose').onclick = closeModal;
    document.getElementById('modalBg').addEventListener('click', function(e){ if(e.target.id==='modalBg') closeModal(); });
    if(isEdit){
      document.getElementById('st_delete').onclick = function(){
        var admins = state.config.staff.filter(function(x){ return x.role==='admin'; });
        if(s.role==='admin' && admins.length<=1){ toast('At least one admin must remain'); return; }
        state.config.staff = state.config.staff.filter(function(x){ return x.id!==s.id; });
        setKV('config', state.config).then(function(){ closeModal(); render(); toast('Staff removed'); });
      };
    }
    document.getElementById('st_save').onclick = function(){
      var name = document.getElementById('st_name').value.trim(), pin=document.getElementById('st_pin').value.trim();
      if(!name || pin.length<4){ toast('Enter a name and at least a 4-digit PIN'); return; }
      var role = document.getElementById('st_role').value, lang = document.getElementById('st_lang').value;
      if(isEdit){ s.name=name; s.pin=pin; s.role=role; s.lang=lang; }
      else { state.config.staff.push({id:uid(), name:name, pin:pin, role:role, lang:lang}); }
      setKV('config', state.config).then(function(){ closeModal(); render(); toast(isEdit?'Staff updated':'Staff added'); });
    };
  }
  function exportBackupFile(){
    Promise.all([getAll('items'),getAll('sales'),getAll('customers')]).then(function(res){
      var payload = {exportedAt:Date.now(), items:res[0], sales:res[1], customers:res[2], config: state.config};
      var blob = new Blob([JSON.stringify(payload, null, 2)], {type:'application/json'});
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = 'ahms-backup-'+fmtDate(Date.now()).replace(/\s+/g,'-')+'.json';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
      toast('Backup file downloaded');
    });
  }
  function importBackupFile(file){
    requireReauth('Restore data from a backup file (replaces data on this device)', function(){
      var reader = new FileReader();
      reader.onload = function(){
        try{
          var payload = JSON.parse(reader.result);
          var puts = [];
          (payload.items||[]).forEach(function(it){ puts.push(putOne('items', it)); });
          (payload.sales||[]).forEach(function(s){ puts.push(putOne('sales', s)); });
          (payload.customers||[]).forEach(function(c){ puts.push(putOne('customers', c)); });
          Promise.all(puts).then(function(){ loadData().then(function(){ render(); toast('Data restored from file'); }); });
        }catch(e){ toast('That file could not be read — make sure it\'s a backup .json file'); }
      };
      reader.readAsText(file);
    });
  }
  function wireSettings(){
    document.getElementById('set_exportFile').onclick = exportBackupFile;
    document.getElementById('set_importFile').addEventListener('change', function(e){
      if(e.target.files && e.target.files[0]) importBackupFile(e.target.files[0]);
    });
    document.getElementById('set_saveClientId').onclick = function(){
      state.config.driveClientId = document.getElementById('set_clientId').value.trim();
      setKV('config', state.config).then(function(){ toast('Client ID saved'); });
    };
    document.getElementById('set_connectDrive').onclick = driveConnect;
    document.getElementById('set_backupNow').onclick = function(){ driveBackupNow(true); };
    document.getElementById('set_restore').onclick = driveRestore;
    document.getElementById('addStaffBtn').onclick = function(){ staffFormModal(null); };
    Array.prototype.forEach.call(document.querySelectorAll('[data-editstaff]'), function(btn){ btn.onclick=function(){ staffFormModal(btn.dataset.editstaff); }; });
  }

  // ================= GOOGLE DRIVE SYNC =================
  var driveTokenClient=null, driveAccessToken=null;
  var FILE_NAME = 'ahms_shop_backup.json';

  function isSecureOrigin(){ return location.protocol==='https:' || location.hostname==='localhost'; }

  function ensureTokenClient(){
    if(!window.google || !google.accounts || !google.accounts.oauth2){ toast('Google sign-in script did not load — check your internet connection'); return null; }
    if(!state.config.driveClientId) return null;
    if(!driveTokenClient){
      driveTokenClient = google.accounts.oauth2.initTokenClient({ client_id: state.config.driveClientId, scope:'https://www.googleapis.com/auth/drive.file', callback:function(){} });
    }
    return driveTokenClient;
  }
  function driveConnect(){
    if(!isSecureOrigin()){ toast('Open the app via your https:// link first — Google will not connect from a local file (see SETUP-GUIDE.md)'); return; }
    if(!state.config.driveClientId){ toast('Save your Client ID first'); return; }
    var tc = ensureTokenClient(); if(!tc) return;
    tc.callback = function(resp){
      if(resp && resp.access_token){
        driveAccessToken = resp.access_token; state.config.driveConnected = true;
        setKV('config', state.config); toast('Google Drive connected'); driveBackupNow(false);
      } else { toast('Drive connection failed: ' + (resp && resp.error ? resp.error : 'unknown error — check the Client ID and authorized origin match this exact web address')); }
    };
    tc.requestAccessToken({prompt:'consent'});
  }
  function maybeSilentDriveConnect(){
    if(!state.config.driveClientId || !state.config.driveConnected || !isSecureOrigin() || !navigator.onLine) return;
    setTimeout(function(){
      var tc = ensureTokenClient(); if(!tc) return;
      tc.callback = function(resp){ if(resp && resp.access_token) driveAccessToken = resp.access_token; };
      try{ tc.requestAccessToken({prompt:''}); }catch(e){}
    }, 800);
  }
  function driveApiFetch(url, opts){
    opts = opts||{}; opts.headers = opts.headers||{}; opts.headers['Authorization'] = 'Bearer '+driveAccessToken;
    return fetch(url, opts);
  }
  function findDriveFileId(){
    return driveApiFetch('https://www.googleapis.com/drive/v3/files?spaces=drive&q='+encodeURIComponent("name='"+FILE_NAME+"' and trashed=false")+'&fields=files(id,modifiedTime)')
      .then(function(r){ return r.json(); }).then(function(data){ return (data.files && data.files[0]) ? data.files[0] : null; });
  }
  function driveBackupNow(manual){
    if(!isSecureOrigin()){ if(manual) toast('Open via your https:// link to use Drive'); return; }
    if(!state.config.driveClientId){ if(manual) toast('Set up Google Drive in Settings first'); return; }
    if(!navigator.onLine){ if(manual) toast('Offline — will back up automatically once internet is back'); return; }
    if(!driveAccessToken){
      var tc = ensureTokenClient(); if(!tc){ return; }
      tc.callback = function(resp){ if(resp && resp.access_token){ driveAccessToken=resp.access_token; doBackupUpload(manual); } else if(manual){ toast('Could not connect to Drive: '+(resp&&resp.error?resp.error:'unknown')); } };
      tc.requestAccessToken({prompt: manual?'consent':''});
      return;
    }
    doBackupUpload(manual);
  }
  function doBackupUpload(manual){
    Promise.all([getAll('items'),getAll('sales'),getAll('customers')]).then(function(res){
      var payload = {exportedAt:Date.now(), items:res[0], sales:res[1], customers:res[2], config: state.config};
      var metadata = {name:FILE_NAME, mimeType:'application/json'};
      return findDriveFileId().then(function(existing){
        var boundary = '-------ahms'+Date.now();
        var body = "--"+boundary+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify(metadata)+
          "\r\n--"+boundary+"\r\nContent-Type: application/json\r\n\r\n"+JSON.stringify(payload)+"\r\n--"+boundary+"--";
        var url = existing ? ('https://www.googleapis.com/upload/drive/v3/files/'+existing.id+'?uploadType=multipart') : 'https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart';
        return driveApiFetch(url, {method: existing?'PATCH':'POST', headers:{'Content-Type':'multipart/related; boundary='+boundary}, body:body});
      });
    }).then(function(r){
      if(r && r.ok){ state.config.lastBackupTs = Date.now(); setKV('config', state.config).then(function(){ if(manual) toast('Backed up to Google Drive'); render(); }); }
      else if(manual) toast('Backup failed — try reconnecting Drive in Settings');
    }).catch(function(){ if(manual) toast('Backup failed — check your connection'); });
  }
  function driveRestore(){
    if(!isSecureOrigin()){ toast('Open via your https:// link to use Drive'); return; }
    if(!state.config.driveClientId){ toast('Set up Google Drive first'); return; }
    requireReauth('Restore data from Google Drive (replaces data on this device)', function(){
      if(!driveAccessToken){
        var tc = ensureTokenClient(); if(!tc) return;
        tc.callback = function(resp){ if(resp && resp.access_token){ driveAccessToken=resp.access_token; doRestore(); } else { toast('Could not connect to Drive'); } };
        tc.requestAccessToken({prompt:'consent'});
      } else doRestore();
    });
  }
  function doRestore(){
    findDriveFileId().then(function(existing){
      if(!existing){ toast('No backup found on Drive yet'); return; }
      return driveApiFetch('https://www.googleapis.com/drive/v3/files/'+existing.id+'?alt=media').then(function(r){ return r.json(); });
    }).then(function(payload){
      if(!payload) return;
      var puts=[];
      (payload.items||[]).forEach(function(it){ puts.push(putOne('items', it)); });
      (payload.sales||[]).forEach(function(s){ puts.push(putOne('sales', s)); });
      (payload.customers||[]).forEach(function(c){ puts.push(putOne('customers', c)); });
      return Promise.all(puts);
    }).then(function(){ loadData().then(function(){ render(); toast('Data restored from Drive'); }); }).catch(function(){ toast('Restore failed'); });
  }
  var syncTimer;
  function scheduleAutoSync(){ clearTimeout(syncTimer); syncTimer = setTimeout(function(){ if(navigator.onLine) driveBackupNow(false); }, 4000); }
  window.addEventListener('online', function(){ toast('Back online — syncing to Drive'); driveBackupNow(false); });

  if('serviceWorker' in navigator){ window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); }); }

  boot();
})();
