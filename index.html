<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Allah Hoo Mobile Shop</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="theme-color" content="#122341">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --navy:#122341; --navy-deep:#0B182E; --amber:#F5A623; --amber-deep:#D98A12;
    --paper:#F5F6F3; --card:#FFFFFF; --ink:#16181D; --ink-soft:#5C6270; --line:#E4E5E1;
    --green:#1E8F71; --red:#C7402C; --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    -webkit-tap-highlight-color:transparent;}
  button, input, select{font-family:inherit;}
  button{transition:transform .08s ease, background .15s ease;}
  button:active{transform:scale(.96);}
  #app{min-height:100vh;display:none;flex-direction:column;padding-bottom:64px;}
  #app.show{display:flex;}
  #main{animation:fadein .18s ease;}
  @keyframes fadein{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}

  header.top{background:var(--navy);color:#fff;padding:16px 20px 18px;position:relative;overflow:hidden;display:flex;justify-content:space-between;align-items:flex-start;}
  header.top .htext h1{margin:0;font-size:18px;font-weight:700;}
  header.top .htext .sub{margin-top:3px;font-size:12px;color:#B9C2D6;}
  header.top .hright{text-align:right;font-size:11.5px;color:#DCE3F0;}
  header.top .hright b{display:block;font-size:12.5px;}
  header.top .hbtns{display:flex;gap:6px;margin-top:6px;justify-content:flex-end;}
  header.top .hbtns button{background:rgba(255,255,255,.12);border:none;color:#fff;font-size:11px;padding:5px 9px;border-radius:6px;cursor:pointer;}

  main{flex:1;padding:16px;max-width:960px;width:100%;margin:0 auto;}

  nav.tabs{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);
    display:flex;z-index:20;padding-bottom:env(safe-area-inset-bottom);overflow-x:auto;}
  nav.tabs button{flex:1;min-width:58px;border:none;background:none;padding:9px 2px 8px;font-size:10.5px;color:var(--ink-soft);
    display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;}
  nav.tabs button .ic{font-size:17px;line-height:1;}
  nav.tabs button.active{color:var(--navy);font-weight:700;}
  nav.tabs button.active .ic{color:var(--amber-deep);}

  @media(min-width:760px){
    #app.show{flex-direction:row;}
    header.top{display:none;}
    nav.tabs{position:static;flex-direction:column;width:200px;border-top:none;border-right:1px solid var(--line);
      background:var(--navy);padding:20px 0;height:100vh;position:sticky;top:0;overflow-x:visible;}
    nav.tabs .brand{color:#fff;padding:0 16px 14px;border-bottom:1px solid rgba(255,255,255,.12);margin-bottom:8px;}
    nav.tabs .brand b{display:block;font-size:14px;}
    nav.tabs .brand span{display:block;font-size:11px;color:#AEB8CC;margin-top:2px;}
    nav.tabs button{flex-direction:row;justify-content:flex-start;gap:9px;padding:10px 16px;color:#B9C2D6;font-size:13px;}
    nav.tabs button.active{background:rgba(245,166,35,.14);color:#fff;border-right:3px solid var(--amber);}
    nav.tabs button.active .ic{color:var(--amber);}
    nav.tabs .navLogout{margin-top:auto;padding:12px 16px;color:#8D97AC;font-size:11.5px;background:none;border:none;text-align:left;cursor:pointer;}
    main{padding:24px 28px;max-width:940px;}
  }

  h2.pagetitle{font-size:16px;margin:2px 0 14px;color:var(--navy);display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:12px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;}
  @media(max-width:480px){.grid3,.grid4{grid-template-columns:1fr 1fr;}}
  .stat b{display:block;font-size:19px;color:var(--navy);}
  .stat span{font-size:11px;color:var(--ink-soft);}
  .pos{color:var(--green) !important;}
  .neg{color:var(--red) !important;}

  label{display:block;font-size:12px;color:var(--ink-soft);margin:10px 0 4px;}
  label:first-child{margin-top:0;}
  input[type=text],input[type=number],input[type=tel],input[type=date],input[type=file],select{
    width:100%;padding:10px 11px;border:1px solid var(--line);border-radius:8px;font-size:14.5px;background:#fff;color:var(--ink);}
  input:focus,select:focus{outline:2px solid var(--amber);outline-offset:-1px;}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:none;border-radius:8px;
    padding:11px 16px;font-size:13.5px;font-weight:600;cursor:pointer;}
  .btn-amber{background:var(--amber);color:#2B1C00;}
  .btn-navy{background:var(--navy);color:#fff;}
  .btn-outline{background:none;border:1px solid var(--line);color:var(--ink);}
  .btn-danger{background:#FBE9E6;color:var(--red);}
  .btn-green{background:#E4F4EF;color:var(--green);}
  .btn-block{width:100%;}
  .btn-sm{padding:6px 11px;font-size:12px;}
  .btn:disabled{opacity:.55;cursor:default;}
  .row{display:flex;gap:8px;flex-wrap:wrap;}

  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--ink-soft);
    padding:6px 8px;border-bottom:1px solid var(--line);}
  td{padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top;}
  tr:last-child td{border-bottom:none;}
  .muted{color:var(--ink-soft);}
  .pill{display:inline-block;padding:2px 8px;border-radius:20px;font-size:10.5px;font-weight:600;}
  .pill.mobile{background:#E8EEFC;color:#1E4FBF;}
  .pill.accessory{background:#FBF0DC;color:#946200;}
  .pill.othercat{background:#EAE3F7;color:#5B3AA5;}
  .pill.credit{background:#FDEAE6;color:#B4402A;}
  .pill.cash{background:#E4F4EF;color:#1E8F71;}
  .pill.return{background:#F1E5FB;color:#6A2FB0;}
  .pill.role{background:#EEF1F6;color:var(--navy);}
  .badge-low{color:var(--red);font-weight:700;}

  .banner{border-radius:var(--radius);padding:12px 14px;margin-bottom:12px;font-size:12.5px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .banner.warn{background:#FBF0DC;color:#7A5300;}
  .banner.info{background:#E8EEFC;color:#1E4FBF;}
  .banner.err{background:#FBE9E6;color:var(--red);}

  .scanbox{background:var(--navy);border-radius:var(--radius);padding:16px;color:#fff;margin-bottom:14px;}
  .scanbox input{background:#fff;color:#111;}
  .scanbox .hint{font-size:11px;color:#B9C2D6;margin-top:8px;line-height:1.5;}

  .quicksellrow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;}
  .quicksellchip{flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:12px;cursor:pointer;white-space:nowrap;}
  .quicksellchip b{display:block;font-size:12.5px;color:var(--navy);}
  .quicksellchip span{color:var(--ink-soft);font-size:10.5px;}

  .cartline{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);}
  .cartline:last-child{border-bottom:none;}
  .cartline .name{flex:1;min-width:0;}
  .cartline .name b{display:block;font-size:13px;}
  .cartline .name span{font-size:10.5px;color:var(--ink-soft);}
  .cartline input[type=number]{width:54px;text-align:center;padding:6px;}
  .cartline .rate{width:72px;padding:6px;text-align:right;}
  .cartline .remove{background:none;border:none;color:var(--red);font-size:18px;cursor:pointer;padding:0 4px;}

  .totalbar{display:flex;justify-content:space-between;align-items:center;padding-top:8px;font-size:13px;color:var(--ink-soft);}
  .totalbar.grand{font-size:15px;font-weight:700;color:var(--navy);border-top:1px solid var(--line);margin-top:6px;padding-top:10px;}
  .empty{text-align:center;padding:32px 10px;color:var(--ink-soft);font-size:13px;}
  .searchbar{display:flex;gap:8px;margin-bottom:12px;}
  .searchbar input{flex:1;}
  .filterchips{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap;}
  .chip{padding:6px 12px;border-radius:20px;font-size:11.5px;border:1px solid var(--line);background:#fff;cursor:pointer;color:var(--ink-soft);}
  .chip.active{background:var(--navy);color:#fff;border-color:var(--navy);}

  .toast{position:fixed;bottom:78px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;
    padding:10px 18px;border-radius:30px;font-size:13px;z-index:100;box-shadow:0 6px 20px rgba(0,0,0,.2);max-width:90vw;text-align:center;
    animation:toastin .18s ease;}
  @keyframes toastin{from{opacity:0;transform:translate(-50%,8px);}to{opacity:1;transform:translate(-50%,0);}}
  @media(min-width:760px){.toast{bottom:20px;}}

  .modal-bg{position:fixed;inset:0;background:rgba(10,15,30,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fadein2 .12s ease;}
  @keyframes fadein2{from{opacity:0;}to{opacity:1;}}
  @media(min-width:760px){.modal-bg{align-items:center;}}
  .modal{background:#fff;border-radius:14px 14px 0 0;padding:18px;width:100%;max-width:480px;max-height:88vh;overflow:auto;}
  @media(min-width:760px){.modal{border-radius:14px;}}
  .modal h3{margin:0 0 12px;font-size:15px;color:var(--navy);}
  .modal-close{float:right;background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;}

  .barcode-preview{text-align:center;padding:14px;background:#fff;border:1px dashed var(--line);border-radius:8px;margin-top:10px;}
  .barcode-preview .lbl-name{font-weight:700;font-size:13px;margin-bottom:2px;}
  .barcode-preview .lbl-price{font-size:12px;color:var(--ink-soft);margin-bottom:6px;}

  #printArea{display:none;}
  @media print{
    body *{visibility:hidden;}
    #printArea, #printArea *{visibility:visible;}
    #printArea{display:block !important;position:absolute;top:0;left:0;width:100%;}
    .printlabel{display:inline-block;width:32%;margin:0.5%;padding:8px;border:1px dashed #999;text-align:center;page-break-inside:avoid;}
    .printlabel .pn{font-size:11px;font-weight:700;margin-bottom:2px;}
    .printlabel .pp{font-size:10px;color:#333;margin-bottom:4px;}
    .receipt{width:320px;margin:0 auto;font-family:monospace;font-size:12px;}
    .receipt h3{text-align:center;margin:0 0 2px;font-size:14px;}
    .receipt .center{text-align:center;}
    .receipt table{width:100%;border-collapse:collapse;font-size:11px;}
    .receipt td{padding:2px 0;border:none;}
    .receipt hr{border:none;border-top:1px dashed #333;}
  }
  .loading{padding:60px 20px;text-align:center;color:var(--ink-soft);font-size:13px;}

  #lockScreen{min-height:100vh;background:var(--navy);color:#fff;display:flex;align-items:center;justify-content:center;padding:20px;}
  #lockScreen.hide{display:none;}
  .lockbox{width:100%;max-width:340px;text-align:center;}
  .lockbox .shoptitle{font-size:19px;font-weight:700;margin-bottom:2px;}
  .lockbox .shopsub{font-size:12px;color:#AEB8CC;margin-bottom:26px;}
  .stafflist{display:flex;flex-direction:column;gap:10px;}
  .staffbtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);color:#fff;padding:14px;border-radius:10px;font-size:14.5px;font-weight:600;cursor:pointer;}
  .staffbtn:active{background:rgba(245,166,35,.25);}
  .pinpad{margin-top:18px;}
  .pindots{display:flex;justify-content:center;gap:12px;margin:14px 0 20px;}
  .pindot{width:13px;height:13px;border-radius:50%;border:2px solid #fff;}
  .pindot.filled{background:var(--amber);border-color:var(--amber);}
  .padgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:260px;margin:0 auto;}
  .padkey{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;font-size:19px;
    padding:16px 0;border-radius:10px;cursor:pointer;}
  .padkey:active{background:rgba(245,166,35,.3);}
  .backlink{margin-top:18px;background:none;border:none;color:#AEB8CC;font-size:12.5px;cursor:pointer;text-decoration:underline;}
  .pinerr{color:#F1A9A0;font-size:12px;margin-top:6px;height:14px;}

  .setupwrap{max-width:380px;margin:0 auto;text-align:left;}
  .setupwrap h1{font-size:17px;margin-bottom:4px;}
  .setupwrap p.hint{font-size:12px;color:#AEB8CC;margin-bottom:18px;}
  .setupwrap label{color:#DCE3F0;}

  .ledgerrow{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px;}
  .ledgerrow:last-child{border-bottom:none;}
  .balpos{color:var(--red);font-weight:700;}
  .balzero{color:var(--green);font-weight:700;}

  [dir="rtl"] .cartline .remove{order:-1;}
</style>
</head>
<body>

<div id="lockScreen"><div class="lockbox" id="lockContent"></div></div>

<div id="app">
  <header class="top">
    <div class="htext">
      <h1>Allah Hoo Mobile Shop</h1>
      <div class="sub">Thingi Colony</div>
    </div>
    <div class="hright" id="headerStaff"></div>
  </header>

  <nav class="tabs" id="tabs">
    <div class="brand">
      <b>Allah Hoo Mobile Shop</b>
      <span>Thingi Colony · Asif &amp; Faisal</span>
    </div>
  </nav>

  <main id="main"><div class="loading">Loading…</div></main>
</div>

<div id="printArea"></div>

<script>
(function(){
  "use strict";

  // ================= i18n =================
  var STRINGS = {
    en:{ dashboard:'Dashboard', billing:'Sell / Scan', inventory:'Inventory', khata:'Khata', barcodes:'Barcodes', reports:'Reports', settings:'Settings',
      lockSwitch:'Lock / Switch user', addItem:'+ Add item', completeSale:'Complete Sale', cart:'Cart', today:'Today', thisWeek:'This week', thisMonth:'This month',
      custom:'Custom', revenue:'Revenue', cost:'Cost', profit:'Profit', loss:'Loss', totalSale:'Total sale', addCustomer:'+ Add customer', save:'Save', cancel:'Cancel' },
    ur:{ dashboard:'ڈیش بورڈ', billing:'فروخت / اسکین', inventory:'انوینٹری', khata:'کھاتہ', barcodes:'بار کوڈ', reports:'رپورٹس', settings:'ترتیبات',
      lockSwitch:'لاک / صارف تبدیل کریں', addItem:'+ آئٹم شامل کریں', completeSale:'سیل مکمل کریں', cart:'کارٹ', today:'آج', thisWeek:'اس ہفتے', thisMonth:'اس مہینے',
      custom:'مخصوص تاریخ', revenue:'آمدنی', cost:'لاگت', profit:'منافع', loss:'نقصان', totalSale:'کل فروخت', addCustomer:'+ گاہک شامل کریں', save:'محفوظ کریں', cancel:'منسوخ' }
  };
  function t(key){
    var lang = (state.currentStaff && state.currentStaff.lang) || 'en';
    return (STRINGS[lang] && STRINGS[lang][key]) || STRINGS.en[key] || key;
  }

  // ================= resilient library loader =================
  // Tries several CDNs in turn so one being blocked (ad-blocker, ISP, firewall) doesn't kill the feature.
  var LIB = { barcode:false, pdf:false };
  function loadScriptChain(urls, checkGlobal, onDone, idx){
    idx = idx || 0;
    if(idx>=urls.length){ onDone(false); return; }
    if(checkGlobal()){ onDone(true); return; }
    var s = document.createElement('script');
    s.src = urls[idx];
    s.onload = function(){ setTimeout(function(){ if(checkGlobal()) onDone(true); else loadScriptChain(urls, checkGlobal, onDone, idx+1); }, 30); };
    s.onerror = function(){ loadScriptChain(urls, checkGlobal, onDone, idx+1); };
    document.head.appendChild(s);
  }
  function loadBarcodeLib(cb){
    loadScriptChain([
      'https://cdnjs.cloudflare.com/ajax/libs/JsBarcode/3.11.5/JsBarcode.all.min.js',
      'https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js',
      'https://unpkg.com/jsbarcode@3.11.5/dist/JsBarcode.all.min.js'
    ], function(){ return typeof window.JsBarcode !== 'undefined'; }, function(ok){ LIB.barcode = ok; if(cb) cb(ok); if(state.tab==='barcodes') render(); });
  }
  function loadPdfLib(cb){
    loadScriptChain([
      'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
      'https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js',
      'https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js'
    ], function(){ return typeof window.jspdf !== 'undefined'; }, function(ok){ LIB.pdf = ok; if(cb) cb(ok); });
  }

  // ================= IndexedDB helpers =================
  function openDB(){
    return new Promise(function(resolve,reject){
      var req = indexedDB.open('ahms_db', 2);
      req.onupgradeneeded = function(e){
        var db = e.target.result;
        if(!db.objectStoreNames.contains('items')) db.createObjectStore('items',{keyPath:'id'});
        if(!db.objectStoreNames.contains('sales')) db.createObjectStore('sales',{keyPath:'id'});
        if(!db.objectStoreNames.contains('customers')) db.createObjectStore('customers',{keyPath:'id'});
        if(!db.objectStoreNames.contains('kv')) db.createObjectStore('kv',{keyPath:'key'});
        if(!db.objectStoreNames.contains('stockLog')) db.createObjectStore('stockLog',{keyPath:'id'});
      };
      req.onsuccess = function(e){ resolve(e.target.result); };
      req.onerror = function(e){ reject(e); };
    });
  }
  function withStore(store, mode, fn){
    return openDB().then(function(db){
      return new Promise(function(resolve,reject){
        var tx = db.transaction(store, mode);
        var os = tx.objectStore(store);
        var result;
        fn(os, function(r){ result = r; });
        tx.oncomplete = function(){ resolve(result); };
        tx.onerror = function(){ reject(tx.error); };
      });
    });
  }
  function getAll(store){ return withStore(store,'readonly', function(os,done){ var r=os.getAll(); r.onsuccess=function(){ done(r.result||[]); }; }); }
  function putOne(store,obj){ return withStore(store,'readwrite', function(os,done){ os.put(obj); done(obj); }); }
  function deleteOne(store,id){ return withStore(store,'readwrite', function(os,done){ os.delete(id); done(true); }); }
  function getKV(key,fallback){ return withStore('kv','readonly', function(os,done){ var r=os.get(key); r.onsuccess=function(){ done(r.result?r.result.value:fallback); }; }); }
  function setKV(key,value){ return withStore('kv','readwrite', function(os,done){ os.put({key:key,value:value}); done(value); }); }

  function logStock(type,itemId,itemName,qtyChange,note){
    return putOne('stockLog', {id:uid(),ts:Date.now(),type:type,itemId:itemId,itemName:itemName,qtyChange:qtyChange,note:note||'',staffName:state.currentStaff?state.currentStaff.name:''});
  }

  // ================= state =================
  var state = {
    items:[], sales:[], customers:[], stockLog:[], config:null,
    currentStaff:null, tab:'dashboard',
    invFilter:'all', invSearch:'',
    cart:[], cartPaymentType:'cash', cartCustomerId:null, cartDiscount:0,
    pinBuffer:'', reportRange:'today', reportFrom:null, reportTo:null
  };

  function uid(){ return 'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function money(n){ n=Number(n)||0; return 'Rs '+n.toLocaleString('en-PK',{maximumFractionDigits:0}); }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function fmtTime(ts){ var d=new Date(ts); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}); }
  function fmtDate(ts){ var d=new Date(ts); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
  function startOfDay(d){ var x=new Date(d); x.setHours(0,0,0,0); return x; }
  function startOfWeek(d){ var x=startOfDay(d); var day=x.getDay(); var diff=(day===0?6:day-1); x.setDate(x.getDate()-diff); return x; }
  function startOfMonth(d){ var x=startOfDay(d); x.setDate(1); return x; }
  function plClass(n){ return n<0?'neg':(n>0?'pos':''); }

  var toastTimer;
  function toast(msg){
    var el = document.getElementById('toastEl');
    if(el) el.remove();
    el = document.createElement('div'); el.id='toastEl'; el.className='toast'; el.textContent=msg;
    document.body.appendChild(el);
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ el.remove(); }, 2600);
  }

  // ================= roles =================
  function role(){ return state.currentStaff ? state.currentStaff.role : 'entry'; }
  function isAdmin(){ return role()==='admin'; }
  function canEdit(){ return role()==='admin' || role()==='editor'; }   // add/edit/delete inventory, edit sales, delete customers
  function canSettings(){ return role()==='admin'; }

  // ================= env warning (file:// breaks Drive + reduces reliability) =================
  function envWarningHTML(){
    if(location.protocol==='file:'){
      return '<div class="banner err">This copy is open as a local file. Barcode/Drive/offline features are unreliable this way — open it using your https:// hosted link instead (see SETUP-GUIDE.md).</div>';
    }
    return '';
  }

  // ================= boot =================
  function boot(){
    loadBarcodeLib(); loadPdfLib();
    getKV('config', null).then(function(cfg){
      state.config = cfg;
      if(!cfg || !cfg.setupDone){ renderSetupWizard(); }
      else { renderStaffPicker(); }
    });
  }
  function loadData(){
    return Promise.all([getAll('items'),getAll('sales'),getAll('customers'),getAll('stockLog')]).then(function(res){
      state.items=res[0]; state.sales=res[1]; state.customers=res[2]; state.stockLog=res[3];
    });
  }
  function markDirtyAndSync(){ scheduleAutoSync(); }

  // ================= SETUP WIZARD =================
  function renderSetupWizard(){
    var lc = document.getElementById('lockContent');
    lc.innerHTML = ''+
    '<div class="setupwrap">'+
      '<h1>Set up Allah Hoo Mobile Shop</h1>'+
      '<p class="hint">One-time setup. Both owners get full admin access by default — you can add employee logins with limited access later from Settings.</p>'+
      '<label>Asif Hussain — login PIN</label><input type="text" inputmode="numeric" maxlength="6" id="s_pin1" placeholder="e.g. 1122">'+
      '<label>Faisal Ali — login PIN</label><input type="text" inputmode="numeric" maxlength="6" id="s_pin2" placeholder="e.g. 3344">'+
      '<button class="btn btn-amber btn-block" style="margin-top:18px" id="s_save">Save &amp; continue</button>'+
    '</div>';
    document.getElementById('s_save').onclick = function(){
      var p1=document.getElementById('s_pin1').value.trim(), p2=document.getElementById('s_pin2').value.trim();
      if(p1.length<4||p2.length<4){ toast('Each PIN should be at least 4 digits'); return; }
      var cfg = {
        setupDone:true,
        staff:[{id:'asif',name:'Asif Hussain',pin:p1,role:'admin',lang:'en'},{id:'faisal',name:'Faisal Ali',pin:p2,role:'admin',lang:'en'}],
        categories:['mobile','accessory'],
        driveClientId:'', driveConnected:false, lastBackupTs:0
      };
      setKV('config',cfg).then(function(){ state.config=cfg; renderStaffPicker(); toast('Setup complete'); });
    };
  }

  // ================= LOGIN =================
  function renderStaffPicker(){
    var lc = document.getElementById('lockContent');
    lc.innerHTML = ''+
    '<div class="shoptitle">Allah Hoo Mobile Shop</div>'+
    '<div class="shopsub">Thingi Colony — select your name</div>'+
    '<div class="stafflist">'+ state.config.staff.map(function(s){ return '<button class="staffbtn" data-staff="'+s.id+'">'+esc(s.name)+'</button>'; }).join('') +'</div>';
    Array.prototype.forEach.call(document.querySelectorAll('[data-staff]'), function(btn){
      btn.onclick = function(){
        var s = state.config.staff.find(function(x){ return x.id===btn.dataset.staff; });
        renderPinPad('Enter PIN for '+s.name, function(entered){
          if(entered===s.pin){ state.currentStaff=s; unlockApp(); return true; }
          return false;
        }, renderStaffPicker);
      };
    });
  }
  function renderPinPad(title, onComplete, onBack){
    state.pinBuffer='';
    var lc = document.getElementById('lockContent');
    lc.innerHTML = '<div class="pinpad"><div class="shoptitle" style="font-size:15px">'+esc(title)+'</div>'+
      '<div class="pindots" id="pindots"></div><div class="pinerr" id="pinerr"></div><div class="padgrid" id="padgrid"></div>'+
      (onBack?'<button class="backlink" id="pinBack">&larr; Back</button>':'')+'</div>';
    renderDots();
    var keys=['1','2','3','4','5','6','7','8','9','','0','DEL'];
    document.getElementById('padgrid').innerHTML = keys.map(function(k){
      return k===''?'<div></div>':'<button class="padkey" data-key="'+k+'">'+(k==='DEL'?'&#9003;':k)+'</button>';
    }).join('');
    Array.prototype.forEach.call(document.querySelectorAll('.padkey'), function(btn){
      btn.onclick = function(){
        var k = btn.dataset.key;
        if(k==='DEL'){ state.pinBuffer = state.pinBuffer.slice(0,-1); }
        else if(state.pinBuffer.length<6){ state.pinBuffer += k; }
        renderDots();
        if(state.pinBuffer.length>=4){
          var ok = onComplete(state.pinBuffer);
          if(ok===false){
            var e=document.getElementById('pinerr'); if(e) e.textContent='Incorrect PIN, try again';
            state.pinBuffer=''; setTimeout(renderDots,50);
          }
        }
      };
    });
    if(onBack){ var b=document.getElementById('pinBack'); if(b) b.onclick=onBack; }
  }
  function renderDots(){
    var box=document.getElementById('pindots'); if(!box) return;
    var html=''; for(var i=0;i<6;i++){ html+='<div class="pindot'+(i<state.pinBuffer.length?' filled':'')+'"></div>'; }
    box.innerHTML=html;
  }

  // Re-authentication for sensitive actions: confirm the CURRENT logged-in user's own PIN
  function requireReauth(actionLabel, onConfirm, onCancel){
    var modal = document.createElement('div'); modal.className='modal-bg';
    modal.innerHTML = '<div class="modal"><h3>Confirm your PIN</h3><p class="muted" style="font-size:12.5px;margin-top:-6px">'+esc(actionLabel)+'</p>'+
      '<input type="text" inputmode="numeric" maxlength="6" id="reauthInput" placeholder="Your login PIN">'+
      '<div class="pinerr" id="reauthErr" style="height:16px"></div>'+
      '<div class="row" style="margin-top:12px"><button class="btn btn-outline btn-block" id="reauthCancel">Cancel</button><button class="btn btn-navy btn-block" id="reauthOk">Confirm</button></div></div>';
    document.body.appendChild(modal);
    var input=document.getElementById('reauthInput');
    setTimeout(function(){ input.focus(); },50);
    function attempt(){
      if(input.value.trim()===state.currentStaff.pin){ modal.remove(); onConfirm(); }
      else{ document.getElementById('reauthErr').textContent='Incorrect PIN'; }
    }
    document.getElementById('reauthOk').onclick = attempt;
    input.addEventListener('keydown', function(e){ if(e.key==='Enter') attempt(); });
    document.getElementById('reauthCancel').onclick = function(){ modal.remove(); if(onCancel) onCancel(); };
  }

  function unlockApp(){
    document.getElementById('lockScreen').classList.add('hide');
    document.getElementById('app').classList.add('show');
    document.documentElement.dir = (state.currentStaff.lang==='ur') ? 'rtl' : 'ltr';
    buildNav();
    document.getElementById('headerStaff').innerHTML = '<b>'+esc(state.currentStaff.name)+'</b><span class="pill role" style="margin-top:2px;display:inline-block">'+role()+'</span>'+
      '<div class="hbtns"><button id="langToggle">'+(state.currentStaff.lang==='ur'?'EN':'اردو')+'</button><button id="logoutBtn2">'+t('lockSwitch')+'</button></div>';
    document.getElementById('logoutBtn2').onclick = lockApp;
    document.getElementById('langToggle').onclick = function(){
      state.currentStaff.lang = state.currentStaff.lang==='ur' ? 'en' : 'ur';
      var s = state.config.staff.find(function(x){ return x.id===state.currentStaff.id; });
      if(s) s.lang = state.currentStaff.lang;
      setKV('config', state.config).then(function(){ document.documentElement.dir = state.currentStaff.lang==='ur'?'rtl':'ltr'; buildNav(); render(); });
    };
    loadData().then(function(){ maybeSilentDriveConnect(); render(); });
  }
  function lockApp(){
    state.currentStaff=null; state.tab='dashboard'; state.cart=[];
    document.getElementById('app').classList.remove('show');
    document.getElementById('lockScreen').classList.remove('hide');
    document.documentElement.dir='ltr';
    renderStaffPicker();
  }

  // ================= nav (role-filtered) =================
  function buildNav(){
    var tabs = [
      {id:'dashboard', ic:'&#9737;', label:t('dashboard'), show:true},
      {id:'billing', ic:'&#128722;', label:t('billing'), show:true},
      {id:'inventory', ic:'&#128230;', label:t('inventory'), show: role()!=='entry'},
      {id:'khata', ic:'&#128179;', label:t('khata'), show:true},
      {id:'barcodes', ic:'&#9776;', label:t('barcodes'), show: role()!=='entry'},
      {id:'reports', ic:'&#128200;', label:t('reports'), show:true},
      {id:'settings', ic:'&#9881;', label:t('settings'), show: canSettings()}
    ];
    var nav = document.getElementById('tabs');
    var brand = nav.querySelector('.brand');
    nav.innerHTML = '';
    if(brand) nav.appendChild(brand); else nav.innerHTML = '<div class="brand"><b>Allah Hoo Mobile Shop</b><span>Thingi Colony</span></div>';
    tabs.filter(function(x){ return x.show; }).forEach(function(x){
      var b = document.createElement('button');
      b.dataset.tab = x.id;
      b.innerHTML = '<span class="ic">'+x.ic+'</span>'+esc(x.label);
      b.onclick = function(){ state.tab=x.id; render(); };
      nav.appendChild(b);
    });
    if(!tabs.some(function(x){ return x.show && x.id===state.tab; })) state.tab='dashboard';
  }

  function render(){
    Array.prototype.forEach.call(document.querySelectorAll('#tabs button[data-tab]'), function(b){ b.classList.toggle('active', b.dataset.tab===state.tab); });
    var main = document.getElementById('main');
    if(state.tab==='dashboard') main.innerHTML = renderDashboard();
    else if(state.tab==='billing') main.innerHTML = renderBilling();
    else if(state.tab==='inventory') main.innerHTML = role()==='entry' ? '<div class="empty">You do not have access to Inventory.</div>' : renderInventory();
    else if(state.tab==='khata') main.innerHTML = renderKhata();
    else if(state.tab==='barcodes') main.innerHTML = role()==='entry' ? '<div class="empty">You do not have access to Barcodes.</div>' : renderBarcodes();
    else if(state.tab==='reports') main.innerHTML = renderReports();
    else if(state.tab==='settings') main.innerHTML = canSettings() ? renderSettings() : '<div class="empty">Admin access only.</div>';
    wireTab();
  }
  function showLowStockModal(){
    var lowStock = state.items.filter(function(it){ return it.stock<=3; });
    var html = '<div class="modal-bg" id="modalBg"><div class="modal"><button class="modal-close" id="modalClose">&times;</button>'+
      '<h3>Low stock items</h3>'+
      (lowStock.length ? ('<table><tr><th>Item</th><th>Stock</th>'+(canEdit()?'<th></th>':'')+'</tr>'+
        lowStock.map(function(it){ return '<tr><td>'+esc(it.name)+'</td><td class="badge-low">'+it.stock+'</td>'+
          (canEdit()?'<td><button class="btn btn-outline btn-sm" data-edit="'+it.id+'">Edit</button></td>':'')+'</tr>'; }).join('')+'</table>')
        : '<div class="empty">No low stock items</div>')+
    '</div></div>';
    var wrap=document.createElement('div'); wrap.innerHTML=html; document.body.appendChild(wrap.firstChild);
    document.getElementById('modalClose').onclick = closeModal;
    document.getElementById('modalBg').addEventListener('click', function(e){ if(e.target.id==='modalBg') closeModal(); });
    Array.prototype.forEach.call(document.querySelectorAll('[data-edit]'), function(btn){
      btn.onclick = function(){ closeModal(); var it=state.items.find(function(x){return x.id===btn.dataset.edit;}); if(it){ state.tab='inventory'; render(); setTimeout(function(){ itemFormModal(it); }, 50); } };
    });
  }
  function wireDashboard(){
    var b = document.getElementById('lowStockBanner'); if(b) b.onclick = showLowStockModal;
    var c = document.getElementById('lowStockStatCard'); if(c) c.onclick = showLowStockModal;
  }
  function wireTab(){
    if(state.tab==='dashboard') wireDashboard();
    else if(state.tab==='billing') wireBilling();
    else if(state.tab==='inventory' && role()!=='entry') wireInventory();
    else if(state.tab==='khata') wireKhata();
    else if(state.tab==='barcodes' && role()!=='entry') wireBarcodes();
    else if(state.tab==='reports') wireReports();
    else if(state.tab==='settings' && canSettings()) wireSettings();
  }

  // ================= DASHBOARD =================
  function salesInRange(fromDate,toDate){
    var t0=fromDate.getTime(), t1=toDate?toDate.getTime():Infinity;
    return state.sales.filter(function(s){ return s.ts>=t0 && s.ts<=t1; });
  }
  function totalOf(list){ return list.reduce(function(s,x){ return s+x.total; },0); }
  function profitOf(list){
    var revenue = totalOf(list);
    var cost = list.reduce(function(s,x){ return s + x.items.reduce(function(ss,l){ return ss + l.qty*(l.cost||0); },0); },0);
    return revenue - cost;
  }

  function renderDashboard(){
    var today=startOfDay(new Date()), week=startOfWeek(new Date()), month=startOfMonth(new Date());
    var lowStock = state.items.filter(function(it){ return it.stock<=3; });
    var stockValue = state.items.reduce(function(s,it){ return s+(it.costPrice||0)*(it.stock||0); },0);
    var expectedSaleValue = state.items.reduce(function(s,it){ return s+(it.sellingPrice||0)*(it.stock||0); },0);
    var potential = expectedSaleValue - stockValue;
    var totalUdhaar = state.customers.reduce(function(s,c){ return s+(c.balance||0); },0);
    var allTimeRevenue = totalOf(state.sales);
    var allTimeProfit = profitOf(state.sales);
    var allTimeCost = allTimeRevenue - allTimeProfit;
    var todaysTotal = totalOf(salesInRange(today));
    var weekTotal = totalOf(salesInRange(week));
    var monthTotal = totalOf(salesInRange(month));
    var todaysProfit = profitOf(salesInRange(today));
    var weekProfit = profitOf(salesInRange(week));
    var monthProfit = profitOf(salesInRange(month));

    return ''+ envWarningHTML() + renderBackupBanner() +
    (lowStock.length ? ('<div class="banner warn" id="lowStockBanner" style="cursor:pointer"><span>&#9888; '+lowStock.length+' item(s) low on stock — tap to view</span></div>') : '')+
    '<h2 class="pagetitle">'+t('dashboard')+'</h2>'+
    '<div class="grid3">'+
      '<div class="card stat"><b class="'+plClass(todaysTotal)+'">'+money(todaysTotal)+'</b><span>'+t('today')+' · '+salesInRange(today).length+' sales</span><div class="'+plClass(todaysProfit)+'" style="font-size:11px;margin-top:2px">'+(todaysProfit<0?'Loss ':'Profit ')+money(Math.abs(todaysProfit))+'</div></div>'+
      '<div class="card stat"><b class="'+plClass(weekTotal)+'">'+money(weekTotal)+'</b><span>'+t('thisWeek')+'</span><div class="'+plClass(weekProfit)+'" style="font-size:11px;margin-top:2px">'+(weekProfit<0?'Loss ':'Profit ')+money(Math.abs(weekProfit))+'</div></div>'+
      '<div class="card stat"><b class="'+plClass(monthTotal)+'">'+money(monthTotal)+'</b><span>'+t('thisMonth')+'</span><div class="'+plClass(monthProfit)+'" style="font-size:11px;margin-top:2px">'+(monthProfit<0?'Loss ':'Profit ')+money(Math.abs(monthProfit))+'</div></div>'+
    '</div>'+
    '<div class="card">'+
      '<b style="font-size:13px;color:var(--navy)">Inventory value overview</b>'+
      '<div class="grid4" style="margin-top:10px">'+
        '<div class="stat"><b>'+state.items.length+'</b><span>Items entered</span></div>'+
        '<div class="stat"><b>'+money(stockValue)+'</b><span>Stock value (cost)</span></div>'+
        '<div class="stat"><b>'+money(expectedSaleValue)+'</b><span>Expected sale value</span></div>'+
        '<div class="stat"><b class="'+plClass(potential)+'">'+money(Math.abs(potential))+' '+(potential<0?'(loss)':(potential>0?'(profit)':''))+'</b><span>Potential margin</span></div>'+
      '</div>'+
    '</div>'+
    '<div class="card">'+
      '<b style="font-size:13px;color:var(--navy)">Overall (all-time) profit / loss</b>'+
      '<div class="grid3" style="margin-top:10px">'+
        '<div class="stat"><b>'+money(allTimeRevenue)+'</b><span>Total sale (all time)</span></div>'+
        '<div class="stat"><b>'+money(allTimeCost)+'</b><span>Total cost (all time)</span></div>'+
        '<div class="stat"><b class="'+plClass(allTimeProfit)+'">'+money(Math.abs(allTimeProfit))+'</b><span>'+(allTimeProfit<0?'Overall loss':'Overall profit')+'</span></div>'+
      '</div>'+
    '</div>'+
    '<div class="grid2">'+
      '<div class="card stat" id="lowStockStatCard" style="'+(lowStock.length?'cursor:pointer':'')+'"><b class="'+(lowStock.length?'neg':'')+'">'+lowStock.length+'</b><span>Low stock (&le;3)'+(lowStock.length?' — tap to view':'')+'</span></div>'+
      '<div class="card stat"><b class="'+(totalUdhaar>0?'neg':'')+'">'+money(totalUdhaar)+'</b><span>Total udhaar owed</span></div>'+
    '</div>'+
    '<div class="card"><b style="font-size:13px;color:var(--navy)">Recent sales</b>'+
      (state.sales.length ? ('<table style="margin-top:8px"><tr><th>Time</th><th>By</th><th style="text-align:right">Total</th></tr>'+
        state.sales.slice(-6).reverse().map(function(s){ return '<tr><td class="muted">'+fmtTime(s.ts)+'</td><td>'+esc(s.staffName||'-')+'</td><td style="text-align:right">'+money(s.total)+'</td></tr>'; }).join('')+'</table>')
        : '<div class="empty">No sales recorded yet.</div>')+
    '</div>';
  }

  function renderBackupBanner(){
    var cfg = state.config;
    var online = navigator.onLine;
    if(!cfg.driveClientId) return '<div class="banner info">Google Drive backup isn\'t set up yet — see Settings.</div>';
    var last = cfg.lastBackupTs||0;
    var hrs = last ? (Date.now()-last)/3600000 : 999;
    if(hrs>24 || !last){
      return '<div class="banner warn"><span>'+(last?('Last Drive backup: '+fmtTime(last)):'No Drive backup yet')+(online?'':' — offline, will sync when internet is back')+'</span>'+
        (online?'<button class="btn btn-navy btn-sm" id="dashBackupBtn">Backup now</button>':'')+'</div>';
    }
    return '';
  }

  // ================= BILLING =================
  function cartSubtotal(){ return state.cart.reduce(function(s,l){ return s+l.qty*l.rate; },0); }
  function cartTotal(){ return Math.max(0, cartSubtotal() - (Number(state.cartDiscount)||0)); }

  function topSellers(limit){
    var totals = {};
    state.sales.forEach(function(s){ if(s.type==='return') return; s.items.forEach(function(l){
      if(!totals[l.itemId]) totals[l.itemId] = {itemId:l.itemId, name:l.name, qty:0};
      totals[l.itemId].qty += l.qty;
    }); });
    return Object.keys(totals).map(function(k){ return totals[k]; }).sort(function(a,b){ return b.qty-a.qty; }).slice(0, limit||5);
  }

  function renderBilling(){
    var lowStock = state.items.filter(function(it){ return it.stock<=3; });
    var top = topSellers(5).map(function(x){ return state.items.find(function(it){ return it.id===x.itemId; }) ? Object.assign({soldQty:x.qty}, state.items.find(function(it){ return it.id===x.itemId; })) : null; }).filter(Boolean);
    return ''+
    (lowStock.length ? ('<div class="banner warn"><span>&#9888; Low stock: '+lowStock.slice(0,3).map(function(i){return esc(i.name);}).join(', ')+(lowStock.length>3?' +'+(lowStock.length-3)+' more':'')+'</span></div>') : '')+
    '<h2 class="pagetitle">'+t('billing')+'</h2>'+
    (top.length ? ('<div class="quicksellrow">'+top.map(function(it){
      return '<div class="quicksellchip" data-quickadd="'+it.id+'"><b>'+esc(it.name)+'</b><span>'+it.soldQty+' sold · '+money(it.sellingPrice)+'</span></div>';
    }).join('')+'</div>') : '')+
    '<div class="scanbox">'+
      '<label style="color:#DCE3F0">1) Scan barcode or type it, then press Enter</label>'+
      '<input type="text" id="scanInput" placeholder="Scan with barcode scanner or type code…" autocomplete="off">'+
      '<div class="hint">A USB/Bluetooth scanner types the code and Enter automatically.</div>'+
    '</div>'+
    '<div class="card">'+
      '<label>2) Or pick an item from the dropdown</label>'+
      '<div class="row"><select id="itemDropdownSel" style="flex:1">'+
        '<option value="">— choose item —</option>'+
        state.items.map(function(it){ return '<option value="'+it.id+'">'+esc(it.name)+' — '+money(it.sellingPrice)+' (stock '+it.stock+')</option>'; }).join('')+
      '</select><button class="btn btn-navy" id="dropdownAddBtn">Add</button></div>'+
    '</div>'+
    '<div class="searchbar"><input type="text" id="nameSearch" placeholder="3) Or find item by name…"></div>'+
    '<div id="nameResults"></div>'+
    '<div class="card">'+
      '<label>4) Or tap a picture to add it — good for a quick visual pick</label>'+
      '<div id="pickGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;max-height:340px;overflow:auto">'+
        (state.items.length ? state.items.map(function(it){
          return '<div data-tileadd="'+it.id+'" style="cursor:pointer;text-align:center;border:1px solid var(--line);border-radius:8px;padding:6px;background:'+(it.stock<=0?'#f3f3f1':'#fff')+';opacity:'+(it.stock<=0?'.5':'1')+'">'+
            (it.image ? ('<img src="'+it.image+'" style="width:100%;height:60px;object-fit:cover;border-radius:6px;margin-bottom:4px">') :
              ('<div style="width:100%;height:60px;border-radius:6px;margin-bottom:4px;background:'+(it.category==='mobile'?'#E8EEFC':'#FBF0DC')+';display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--navy);font-size:20px">'+esc((it.name||'?').charAt(0).toUpperCase())+'</div>'))+
            '<div style="font-size:11px;font-weight:600;line-height:1.2">'+esc(it.name)+'</div>'+
            '<div style="font-size:10px;color:var(--ink-soft)">'+money(it.sellingPrice)+'</div>'+
          '</div>';
        }).join('') : '<div class="empty">No items yet</div>')+
      '</div>'+
    '</div>'+
    '<div class="card" id="cartCard"><b style="font-size:13px;color:var(--navy)">'+t('cart')+'</b>'+renderCart()+'</div>'+
    (state.cart.length ? (
      '<div class="card">'+
        '<label>Payment type</label>'+
        '<select id="paymentTypeSelect"><option value="cash" '+(state.cartPaymentType==='cash'?'selected':'')+'>Cash</option>'+
          '<option value="credit" '+(state.cartPaymentType==='credit'?'selected':'')+'>Udhaar (credit)</option></select>'+
        (state.cartPaymentType==='credit' ? renderCreditCustomerPicker() : '')+
        '<label>Discount (Rs)</label><input type="number" min="0" id="discountInput" value="'+state.cartDiscount+'">'+
      '</div>'+
      '<button class="btn btn-navy btn-block" id="checkoutBtn">'+t('completeSale')+' · '+money(cartTotal())+'</button>'
    ) : '');
  }
  function renderCreditCustomerPicker(){
    var opts = state.customers.map(function(c){ return '<option value="'+c.id+'" '+(state.cartCustomerId===c.id?'selected':'')+'>'+esc(c.name)+' ('+esc(c.phone||'')+')</option>'; }).join('');
    return '<label>Customer</label><select id="creditCustomerSel"><option value="">— select or add in Khata tab —</option>'+opts+'</select>';
  }
  function renderCart(){
    if(!state.cart.length) return '<div class="empty">Cart is empty. Scan or search an item to add it.</div>';
    var lines = state.cart.map(function(l, idx){
      return '<div class="cartline" data-idx="'+idx+'"><div class="name"><b>'+esc(l.name)+'</b><span>'+esc(l.barcode||'manual')+'</span></div>'+
        '<input type="number" min="1" class="qtyInput" value="'+l.qty+'"><input type="number" min="0" class="rateInput" value="'+l.rate+'">'+
        '<button class="remove" data-remove="'+idx+'">&times;</button></div>';
    }).join('');
    var sub = cartSubtotal(), disc = Number(state.cartDiscount)||0;
    return lines + '<div class="totalbar"><span>Subtotal</span><span>'+money(sub)+'</span></div>'+
      (disc>0 ? ('<div class="totalbar"><span>Discount</span><span class="neg">-'+money(disc)+'</span></div>') : '')+
      '<div class="totalbar grand"><span>Total</span><span>'+money(cartTotal())+'</span></div>';
  }
  function addToCart(item){
    var existing = state.cart.find(function(l){ return l.itemId===item.id; });
    if(existing){ existing.qty+=1; } else { state.cart.push({itemId:item.id,name:item.name,barcode:item.barcode,qty:1,rate:item.sellingPrice,cost:item.costPrice||0}); }
    render(); toast(item.name+' added');
  }

  function wireBilling(){
    var scanInput = document.getElementById('scanInput');
    if(scanInput){
      scanInput.focus();
      scanInput.addEventListener('keydown', function(e){
        if(e.key==='Enter'){
          var code = scanInput.value.trim(); scanInput.value='';
          if(!code) return;
          var item = state.items.find(function(it){ return it.barcode===code; });
          if(item){ if(item.stock<=0){ toast('Out of stock: '+item.name); return; } addToCart(item); }
          else toast('No item found for code '+code);
        }
      });
    }
    var nameSearch = document.getElementById('nameSearch');
    var nameResultsBox = document.getElementById('nameResults');
    if(nameSearch){
      nameSearch.addEventListener('input', function(){
        var q = nameSearch.value.trim().toLowerCase();
        if(!q){ nameResultsBox.innerHTML=''; return; }
        var matches = state.items.filter(function(it){ return it.name.toLowerCase().indexOf(q)!==-1; }).slice(0,6);
        nameResultsBox.innerHTML = matches.length ? ('<div class="card" style="padding:6px 10px">'+matches.map(function(it){
          return '<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)">'+
            '<div><b style="font-size:13px">'+esc(it.name)+'</b><div class="muted" style="font-size:11px">'+money(it.sellingPrice)+' · stock '+it.stock+'</div></div>'+
            '<button class="btn btn-outline btn-sm" data-additem2="'+it.id+'">Add</button></div>';
        }).join('')+'</div>') : '<div class="empty">No matching items</div>';
      });
    }
    // Event delegation: results are re-rendered on every keystroke, so bind once on the
    // stable parent container rather than on the buttons themselves (which get replaced).
    if(nameResultsBox && !nameResultsBox.dataset.wired){
      nameResultsBox.dataset.wired = '1';
      nameResultsBox.addEventListener('click', function(e){
        var btn = e.target.closest('[data-additem2]');
        if(!btn) return;
        var it = state.items.find(function(x){ return x.id===btn.dataset.additem2; });
        if(it){ if(it.stock<=0){ toast('Out of stock'); return; } addToCart(it); nameSearch.value=''; nameResultsBox.innerHTML=''; }
      });
    }
    var pickGridBox = document.getElementById('pickGrid');
    if(pickGridBox && !pickGridBox.dataset.wired){
      pickGridBox.dataset.wired = '1';
      pickGridBox.addEventListener('click', function(e){
        var tile = e.target.closest('[data-tileadd]');
        if(!tile) return;
        var it = state.items.find(function(x){ return x.id===tile.dataset.tileadd; });
        if(it){ if(it.stock<=0){ toast('Out of stock'); return; } addToCart(it); }
      });
    }
    var dropdownAddBtn = document.getElementById('dropdownAddBtn');
    if(dropdownAddBtn){
      dropdownAddBtn.onclick = function(){
        var sel = document.getElementById('itemDropdownSel');
        var it = state.items.find(function(x){ return x.id===sel.value; });
        if(!it){ toast('Choose an item first'); return; }
        if(it.stock<=0){ toast('Out of stock'); return; }
        addToCart(it);
      };
    }
    Array.prototype.forEach.call(document.querySelectorAll('[data-quickadd]'), function(chip){
      chip.onclick = function(){ var it=state.items.find(function(x){return x.id===chip.dataset.quickadd;}); if(it){ if(it.stock<=0){toast('Out of stock');return;} addToCart(it); } };
    });
    Array.prototype.forEach.call(document.querySelectorAll('.cartline'), function(row){
      var idx = Number(row.dataset.idx);
      row.querySelector('.qtyInput').addEventListener('change', function(e){ state.cart[idx].qty=Math.max(1,Number(e.target.value)||1); render(); });
      row.querySelector('.rateInput').addEventListener('change', function(e){ state.cart[idx].rate=Math.max(0,Number(e.target.value)||0); render(); });
    });
    Array.prototype.forEach.call(document.querySelectorAll('[data-remove]'), function(btn){ btn.onclick=function(){ state.cart.splice(Number(btn.dataset.remove),1); render(); }; });
    var paySel = document.getElementById('paymentTypeSelect');
    if(paySel) paySel.addEventListener('change', function(){ state.cartPaymentType = paySel.value; render(); });
    var custSel = document.getElementById('creditCustomerSel');
    if(custSel) custSel.addEventListener('change', function(){ state.cartCustomerId = custSel.value || null; });
    var discInput = document.getElementById('discountInput');
    if(discInput) discInput.addEventListener('change', function(){ state.cartDiscount = Math.max(0, Number(discInput.value)||0); render(); });

    var checkout = document.getElementById('checkoutBtn');
    if(checkout){
      checkout.onclick = function(){
        if(checkout.disabled) return;
        if(!state.cart.length) return;
        if(state.cartPaymentType==='credit' && !state.cartCustomerId){ toast('Select a customer for udhaar sale'); return; }
        for(var i=0;i<state.cart.length;i++){
          var l=state.cart[i]; var it=state.items.find(function(x){return x.id===l.itemId;});
          if(it && it.stock<l.qty){ toast('Not enough stock for '+it.name); return; }
        }
        checkout.disabled = true; checkout.textContent = 'Saving…';
        var sale = {
          id:uid(), ts:Date.now(), type:'sale',
          staffId:state.currentStaff.id, staffName:state.currentStaff.name,
          paymentType:state.cartPaymentType, customerId:state.cartPaymentType==='credit'?state.cartCustomerId:null,
          items: state.cart.map(function(l){ return {itemId:l.itemId,name:l.name,qty:l.qty,rate:l.rate,cost:l.cost||0}; }),
          subtotal: cartSubtotal(), discount: Number(state.cartDiscount)||0, total: cartTotal()
        };
        var puts = [putOne('sales', sale)];
        state.cart.forEach(function(l){
          var it = state.items.find(function(x){ return x.id===l.itemId; });
          if(it){ it.stock = Math.max(0, it.stock-l.qty); puts.push(putOne('items', it)); puts.push(logStock('sale', it.id, it.name, -l.qty, 'Sold in sale #'+sale.id.slice(-5))); }
        });
        if(sale.paymentType==='credit'){
          var cust = state.customers.find(function(c){ return c.id===sale.customerId; });
          if(cust){ cust.balance=(cust.balance||0)+sale.total; cust.history=cust.history||[]; cust.history.push({ts:sale.ts,type:'credit',amount:sale.total,note:'Sale #'+sale.id.slice(-5)}); puts.push(putOne('customers', cust)); }
        }
        Promise.all(puts).then(function(){
          markDirtyAndSync();
          loadData().then(function(){
            showReceiptPrompt(sale);
            state.cart=[]; state.cartPaymentType='cash'; state.cartCustomerId=null; state.cartDiscount=0;
          });
        }).catch(function(){ toast('Could not save sale'); checkout.disabled=false; checkout.textContent=t('completeSale'); });
      };
    }
    var dashBtn = document.getElementById('dashBackupBtn'); if(dashBtn) dashBtn.onclick=function(){ driveBackupNow(true); };
  }

  function showReceiptPrompt(sale){
    var modal = document.createElement('div'); modal.className='modal-bg';
    modal.innerHTML = '<div class="modal"><h3>Sale completed</h3><div class="stat" style="margin-bottom:12px"><b style="font-size:22px;color:var(--green)">'+money(sale.total)+'</b><span>Transaction #'+sale.id.slice(-5)+'</span></div>'+
      '<div class="row"><button class="btn btn-outline btn-block" id="rc_done">Done</button><button class="btn btn-navy btn-block" id="rc_print">Print receipt</button></div></div>';
    document.body.appendChild(modal);
    document.getElementById('rc_done').onclick = function(){ modal.remove(); state.tab='dashboard'; render(); };
    document.getElementById('rc_print').onclick = function(){ printReceipt(sale); modal.remove(); state.tab='dashboard'; render(); };
  }

    var area = document.getElementById('printArea'); area.innerHTML='';
    var wrap = document.createElement('div'); wrap.className='receipt';
    wrap.innerHTML = ''+
      '<h3>Allah Hoo Mobile Shop</h3><div class="center">Thingi Colony</div><div class="center">0300-7736777 / 0300-5950440</div><hr>'+
      '<div>Date: '+fmtTime(sale.ts)+'</div><div>Txn #'+sale.id.slice(-6)+' &nbsp; By: '+esc(sale.staffName||'')+'</div><hr>'+
      '<table>'+sale.items.map(function(l){ return '<tr><td colspan="2">'+esc(l.name)+'</td></tr><tr><td>'+Math.abs(l.qty)+' x '+money(l.rate)+'</td><td style="text-align:right">'+money(l.qty*l.rate)+'</td></tr>'; }).join('')+'</table><hr>'+
      '<table><tr><td>Subtotal</td><td style="text-align:right">'+money(sale.subtotal||sale.total)+'</td></tr>'+
      (sale.discount ? ('<tr><td>Discount</td><td style="text-align:right">-'+money(sale.discount)+'</td></tr>') : '')+
      '<tr><td><b>Total</b></td><td style="text-align:right"><b>'+money(sale.total)+'</b></td></tr>'+

      '<svg id="rcBarcode" style="width:100%"></svg>'+
      '<div class="center" style="margin-top:6px">Returns accepted within 7 days with receipt</div>'+
      '<div class="center">Thank you for shopping with us</div>';

    drawBarcodeSVG(document.getElementById('rcBarcode'), 'RET-'+sale.id.slice(-8), {width:1.6,height:40,fontSize:10});
    setTimeout(function(){ window.print(); }, 150);
  }

    });

    '<div class="searchbar"><input type="text" id="invSearchInput" placeholder="Search items…" value="'+esc(state.invSearch)+'">'+
      (canEdit() ? '<button class="btn btn-amber" id="addItemBtn">'+t('addItem')+'</button>' : '')+'</div>'+
    '<div class="filterchips">'+chip('all','All')+cats.map(function(c){ return chip(c, categoryLabel(c)); }).join('')+'</div>'+
    '<div class="row" style="margin-bottom:12px">'+
      '<button class="btn btn-outline" id="pdfCurrentBtn">Download inventory PDF</button>'+
    '</div>'+
    '<div class="card">'+
      '<b style="font-size:13px;color:var(--navy)">Stock activity between dates</b>'+
      '<div class="row" style="margin-top:8px"><input type="date" id="logFrom"><input type="date" id="logTo"><button class="btn btn-navy" id="pdfLogBtn">Download PDF</button></div>'+
    '</div>'+
    '<div class="card" style="padding:0">'+(list.length ? (
      '<table><tr><th>Item</th><th>Price</th><th>Stock</th>'+(canEdit()?'<th></th>':'')+'</tr>'+
      list.map(function(it){
        return '<tr><td><b style="font-size:13px">'+esc(it.name)+'</b><br><span class="pill '+categoryPillClass(it.category)+'">'+esc(categoryLabel(it.category))+'</span> <span class="muted" style="font-size:11px">'+esc(it.barcode)+'</span></td>'+
          '<td>'+money(it.sellingPrice)+'</td><td class="'+(it.stock<=3?'badge-low':'')+'">'+it.stock+'</td>'+
          (canEdit() ? '<td><button class="btn btn-outline btn-sm" data-edit="'+it.id+'">Edit</button></td>' : '')+'</tr>';

  function itemFormModal(existing){
    var isEdit = !!existing;
    var it = existing || {id:null,name:'',category:(state.config.categories||['accessory'])[0],barcode:'',costPrice:0,sellingPrice:0,stock:0};
    var cats = state.config.categories || ['mobile','accessory'];
    var catOpts = cats.map(function(c){ return '<option value="'+esc(c)+'" '+(it.category===c?'selected':'')+'>'+esc(categoryLabel(c))+'</option>'; }).join('') + '<option value="__new__">+ Add new category…</option>';
    var html = '<div class="modal-bg" id="modalBg"><div class="modal">'+
      '<button class="modal-close" id="modalClose">&times;</button>'+
      '<h3>'+(isEdit?'Edit item':'Add new item')+'</h3>'+
      '<label>Item name</label><input type="text" id="f_name" value="'+esc(it.name)+'" placeholder="e.g. Samsung A16 Charger">'+
      '<label>Category</label><select id="f_category">'+catOpts+'</select>'+
      '<label>Barcode</label><div class="row"><input type="text" id="f_barcode" value="'+esc(it.barcode)+'" placeholder="Scan or leave blank" style="flex:1"><button class="btn btn-outline" id="f_genBarcode" type="button">Generate</button></div>'+
      '<div class="grid2"><div><label>Cost price</label><input type="number" id="f_cost" value="'+it.costPrice+'"></div><div><label>Selling price</label><input type="number" id="f_sell" value="'+it.sellingPrice+'"></div></div>'+
      '<label>Stock quantity</label><input type="number" id="f_stock" value="'+it.stock+'">'+
      '<label>Photo (optional — helps staff pick the right item visually)</label>'+
      (it.image ? ('<img src="'+it.image+'" style="max-width:100%;max-height:120px;border-radius:8px;margin-bottom:6px">') : '')+
      '<input type="file" id="f_image" accept="image/*">'+
      '<div class="row" style="margin-top:16px">'+(isEdit?'<button class="btn btn-danger" id="f_delete" type="button">Delete</button>':'')+
        '<button class="btn btn-navy btn-block" id="f_save" type="button">'+(isEdit?'Save changes':'Add item')+'</button></div>'+
    '</div></div>';
    var wrap=document.createElement('div'); wrap.innerHTML=html; document.body.appendChild(wrap.firstChild);
    document.getElementById('modalClose').onclick = closeModal;
    document.getElementById('modalBg').addEventListener('click', function(e){ if(e.target.id==='modalBg') closeModal(); });
    document.getElementById('f_category').addEventListener('change', function(e){
      if(e.target.value==='__new__'){
        var name = window.prompt('New category name (e.g. Chargers, Cases, SIM cards):');
        if(name && name.trim()){
          name = name.trim();
          state.config.categories = state.config.categories || ['mobile','accessory'];
          if(state.config.categories.indexOf(name)===-1) state.config.categories.push(name);
          setKV('config', state.config).then(function(){
            var opt = document.createElement('option'); opt.value=name; opt.textContent=name; opt.selected=true;
            e.target.insertBefore(opt, e.target.lastElementChild);
          });
        } else { e.target.value = it.category; }
      }
    });
    document.getElementById('f_genBarcode').onclick = function(){
      getKV('lastBarcodeSeq',0).then(function(seq){ seq=(seq||0)+1; setKV('lastBarcodeSeq',seq).then(function(){ document.getElementById('f_barcode').value='AHM'+String(seq).padStart(6,'0'); }); });
    };
    if(isEdit){
      document.getElementById('f_delete').onclick = function(){
        requireReauth('Delete "'+it.name+'"', function(){
          closeModal();
          deleteOne('items', it.id).then(function(){ logStock('delete-item', it.id, it.name, 0, 'Deleted'); markDirtyAndSync(); loadData().then(function(){ render(); toast('Item deleted'); }); });
        });
      };
    }
    var saveBtn = document.getElementById('f_save');
    saveBtn.onclick = function(){
      if(saveBtn.disabled) return;
      var name = document.getElementById('f_name').value.trim();
      if(!name){ toast('Enter an item name'); return; }
      var origBtnText = saveBtn.textContent;
      var imageFileInput = document.getElementById('f_image');
      var finish = function(barcode, imageData){
        var data = { id: it.id || uid(), name:name, category:document.getElementById('f_category').value, barcode:barcode,
          costPrice:Number(document.getElementById('f_cost').value)||0, sellingPrice:Number(document.getElementById('f_sell').value)||0,
          stock:Number(document.getElementById('f_stock').value)||0, image: imageData!==undefined ? imageData : (it.image||null) };
        var stockDelta = data.stock - (isEdit ? it.stock : 0);
        requireReauth(isEdit?('Save changes to "'+name+'"'):('Add new item "'+name+'"'), function(){
          saveBtn.disabled = true; saveBtn.textContent = 'Saving…';
          putOne('items', data).then(function(){
            logStock(isEdit?'edit-item':'add-item', data.id, data.name, stockDelta, isEdit?'Edited':'Added new item');
            markDirtyAndSync();
            closeModal();
            loadData().then(function(){ render(); toast(isEdit?'Item updated':'Item added'); });
          }).catch(function(){ toast('Save failed, try again'); saveBtn.disabled=false; saveBtn.textContent=origBtnText; });
        }, function(){ saveBtn.disabled=false; saveBtn.textContent=origBtnText; });
      };
      var withImage = function(barcode){
        if(imageFileInput.files && imageFileInput.files[0]){ fileToBase64(imageFileInput.files[0]).then(function(img){ finish(barcode, img); }).catch(function(){ finish(barcode); }); }
        else { finish(barcode); }
      };
      var barcodeVal = document.getElementById('f_barcode').value.trim();
      if(barcodeVal){ withImage(barcodeVal); }
      else { getKV('lastBarcodeSeq',0).then(function(seq){ seq=(seq||0)+1; setKV('lastBarcodeSeq',seq).then(function(){ withImage('AHM'+String(seq).padStart(6,'0')); }); }); }
    };
  }

  function wireInventory(){

      var rows = state.items.map(function(it){ return [it.name, categoryLabel(it.category), it.barcode, money(it.costPrice), money(it.sellingPrice), it.stock, money(it.costPrice*it.stock)]; });
      var stockVal = state.items.reduce(function(s,it){ return s+(it.costPrice||0)*(it.stock||0); },0);
      var saleVal = state.items.reduce(function(s,it){ return s+(it.sellingPrice||0)*(it.stock||0); },0);

        ['Total items: '+state.items.length, 'Total stock value (cost): '+money(stockVal), 'Total expected sale value: '+money(saleVal), 'Potential margin: '+money(saleVal-stockVal)]);

        .map(function(l){ return [fmtDate(l.ts)+' '+new Date(l.ts).toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'}), l.type, l.itemName, (l.qtyChange>0?'+':'')+l.qtyChange, l.staffName, l.note]; });
      if(!rows.length){ toast('No activity in that range'); return; }
      buildSimplePDF('Stock Activity: '+fromV+' to '+toV, ['Date','Type','Item','Qty change','By','Note'], rows, 'stock-activity.pdf');
    };
  }

  function fileToBase64(file){
    return new Promise(function(resolve,reject){
      var reader = new FileReader();
      reader.onload = function(){ resolve(reader.result); };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function drawBarcodeSVG(svgEl, code, opts){
    opts = opts || {};

      return false;
    }
    try{
      JsBarcode(svgEl, code, {format:'CODE128', width:opts.width||2.4, height:opts.height||72, displayValue:true, fontSize:opts.fontSize||14, margin:opts.margin||14, textMargin:4});
      return true;
    }catch(e){
      svgEl.outerHTML = '<div style="color:var(--red);font-size:12px;padding:10px;border:1px dashed var(--red);border-radius:6px">Could not generate a barcode for this code.</div>';
      return false;
    }
